[package]
name = "people-playground-bevy"
version = "0.1.0"
edition = "2024"
publish = false

[lints.rust]
# fncov: a coverage build's per-function counters for --fn-check (tools/recorder/fncov_via.sh).
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fncov)'] }

[workspace]
members = ["extras"]

[build-dependencies]
cc = "1"

[dependencies]
flate2 = "1"
bytemuck = { version = "1", features = ["derive"] }
bevy = { version = "=0.20.0", default-features = false, features = ["2d", "ui", "default_font", "multi_threaded", "bevy_anti_alias", "smaa_luts", "zstd_rust"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
unicode-general-category = "1.1"
raw-window-handle = "0.6.2"
texture2ddecoder = "0.1.2"
png = "0.18.1"
# Texture2D.LoadImage's JPEG (a mod's or a contraption's image file).
zune-jpeg = "0.5.15"
swash = "0.2.10"
lewton = "0.10.2"
symphonia = { version = "0.5.5", default-features = false, features = ["mp3"] }
cpal = "0.17.3"
matroska-demuxer = "0.8.1"
vp8-decoder = "0.1.1"
sha2 = "0.10"
# New content that is not in the real game (extras/src/lib.rs).
ppg-extras = { path = "extras" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Controls_Dialogs"] }

# Rebuild only what changed in release builds too (the default rebuilds the whole crate every time).
[profile.release]
incremental = true
# Crash reports' backtraces name the functions and lines (a separate .pdb; the exe's code is unchanged).
debug = "line-tables-only"

[profile.dev]
opt-level = 1
debug = 0

[profile.dev.package."*"]
opt-level = 2
