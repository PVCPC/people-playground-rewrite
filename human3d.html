<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PPG Human 3D</title>
<style>
:root{--bg:#1b1d22;--fg:#e8e8e8;--panel:rgba(20,22,26,.85)}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;overflow:hidden}
#ui{position:fixed;top:12px;left:12px;background:var(--panel);padding:12px 14px;border-radius:8px;max-width:290px;line-height:1.5}
#ui h1{font-size:15px;margin:0 0 6px}#ui label{display:block;margin-top:6px}#ui input[type=range]{width:100%}
button{background:#2b2f37;color:var(--fg);border:1px solid #444;border-radius:5px;padding:4px 8px;margin:6px 4px 0 0;cursor:pointer}
small{opacity:.7}
</style></head><body>
<div id="ui"><h1>People Playground human, 3D test</h1>
<small>Each sprite pixel is one cube (1/35 m, as in the game). Drag to rotate, scroll to zoom, right-drag to pan.</small>
<label>Body thickness (px): <span id="tv">10</span><input id="t" type="range" min="4" max="16" value="10"></label>
<label>Limb thickness (px): <span id="lv">5</span><input id="l" type="range" min="2" max="8" value="5"></label>
<label>Walk speed<input id="spd" type="range" min="0" max="3" step="0.1" value="1"></label>
<label><input id="pc" type="checkbox"> Game pixel shading</label>
<label><input id="ef" type="checkbox" checked> Eyes on front (off = game's side eye)</label>
<hr style="border-color:#333">
<label><input id="pm" type="checkbox"> Paint mode <input id="cp" type="color" value="#c2c2c2" style="vertical-align:middle"></label>
<label><input id="mir" type="checkbox" checked> Mirror left/right</label>
<small>Click a cube to paint it. Shift+click picks its colour. Ctrl+click erases. Drag still rotates. Paint is saved in this browser.</small><br>
<button id="clr">Clear paint</button><br>
<button id="pause">Pause</button><button id="side">Side (game view)</button><button id="front">Front</button><button id="spin">Spin camera</button>
</div>

const P={};for(const p of PARTS)P[p.name]=p;

const N4=[[1,0],[-1,0],[0,1],[0,-1]];
// The game's eye: the head's dark pixels that are not on its outline (2x2 on the side).
const hs=new Set(P.Head.px.map(q=>key(q[0],q[1])));

const TORSO=['UpperBody','MiddleBody','LowerBody'];

  return [0,0]}

function build(){

    g.add(m);g.userData.parent=isLimb&&LIMB[base]?LIMB[base]+(front?'Front':''):'body'}

// Painting: click (no drag) paints a cube; Shift+click picks its colour; Ctrl+click erases back to default.
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();let down=null;

  if(Math.hypot(e.clientX-down[0],e.clientY-down[1])>4)return;down=null;

  const targets=[[m,i]];
  if($('mir').checked){const v=vk.split('|'),j=m.userData.keys.indexOf(v.slice(0,3).join('|')+'|'+(-v[3]));if(j>=0&&j!==i)targets.push([m,j])}
  for(const [mm,ii] of targets){const k=mm.userData.keys[ii];
    if(e.ctrlKey)delete paint[k];else paint[k]=$('cp').value.slice(1);
    col.set('#'+(paint[k]||mm.userData.def[ii]));mm.setColorAt(ii,col)}
  m.instanceColor.needsUpdate=true;savePaint()});

$('pm').addEventListener('input',()=>{if($('pm').checked&&!paused)$('pause').click()});
const deg=Math.PI/180;let phase=Math.PI/2,paused=false,last=performance.now();
function pose(){const s=Math.sin(phase),c=Math.cos(phase);
  const leg=(f,sg)=>{const hip=28*deg*sg*s,knee=-deg*(6+45*Math.max(0,Math.sin(phase+(sg>0?Math.PI:0)-0.7)));
    groups['UpperLeg'+f].rotation.z=hip;groups['LowerLeg'+f].rotation.z=knee;groups['Foot'+f].rotation.z=-(hip+knee)*0.7};
  const arm=(f,sg)=>{groups['UpperArm'+f].rotation.z=-22*deg*sg*s;groups['LowerArm'+f].rotation.z=deg*(18+16*Math.max(0,-sg*s))};
  leg('Front',1);leg('',-1);arm('Front',1);arm('',-1);
  root.position.set(-cx,-minY+0.5-1.5+1.5*Math.abs(c),0);root.rotation.z=-2*deg}
const H=60;function view(x,z){cam.position.set(x,H*0.55,z);ctl.target.set(0,H*0.45,0);ctl.update()}
view(70,110);
$('side').onclick=()=>view(0,140);$('front').onclick=()=>view(140,0);$('spin').onclick=()=>{ctl.autoRotate=!ctl.autoRotate};

addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});
